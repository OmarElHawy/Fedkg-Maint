# Stage 7: LLM backend configuration.
#
# The backend is a local Ollama server. The only model installed on this machine
# (checked with `ollama list`) is:
#   llama3.2:latest   1.88 GB   (Llama 3.2 3B, instruct/chat, fits in 6 GB VRAM)
# We did NOT pull or download any model. To switch models, edit `model` below;
# nothing else in the code needs to change (src/explain.py exposes a single
# generate(prompt, system=None) function that reads this file).
backend: ollama
ollama:
  base_url: "http://localhost:11434"
  model: "llama3.2:latest"

# Single-installed-model note: if several chat models had been installed, we
# would pick the smallest instruct model that fits in 6 GB. Only one is present.
generation:
  temperature: 0
  seed: 42
  num_predict: 250          # keep answers short (~250 tokens)
  timeout_s: 180

# Every response is cached here (key = sha256 of model + system + prompt) so
# reruns are free and the run can resume.
cache_path: "results/explanations/cache.jsonl"

# Final FedProx global model from Stage 4b (mu = 0.01, seed 0).
predictions:
  checkpoint: "results/checkpoints/FedProx_4b_seed0.pt"
  factory: "FD004"
  split: "test"
  clip_max: 125
